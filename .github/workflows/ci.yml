name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  source-and-tests:
    name: Source-only Python and JavaScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: python -m pip install -r requirements-app.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_kan_notebook.py
      - run: git diff --exit-code
      - run: python scripts/audit_public_tree.py --history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/check_frontend.cjs

  browser-contract:
    name: Isolated research and theme browser contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: python -m pip install -r requirements-app.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python scripts/run_browser_contract.py
      - run: python scripts/run_mlops_browser.py
