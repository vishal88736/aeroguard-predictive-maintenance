<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">AeroGuard implemented architecture</title><desc id="desc">Browser, validated API, immutable jobs, causal features, independent RUL and anomaly models, development-gated registry, historical replay, Python triage, SQLite orders and MLflow. Test truth stays in evaluation.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#7890ad"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172a46}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#64748b}.l{fill:none;stroke:#7890ad;stroke-width:2;marker-end:url(#a)}.b{fill:#fff;stroke:#dbe6f2;stroke-width:1.5;rx:12}</style></defs>
<rect width="1200" height="710" rx="20" fill="#f4f8fd"/><text x="35" y="42" font-size="24" font-weight="700">AeroGuard · Implemented system</text><text class="s" x="35" y="67">Historical benchmark data → measured predictions → traceable local maintenance records</text>
<g transform="translate(35 100)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">Responsive application</text><text class="s" x="18" y="53">Inter / Lucide / JavaScript / SVG</text><text class="s" x="18" y="72">Ten routes and source-aware UI</text></g>
<g transform="translate(345 100)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">FastAPI + Pydantic</text><text class="s" x="18" y="53">Typed API and local boundaries</text><text class="s" x="18" y="72">Nonblocking persistent jobs</text></g>
<g transform="translate(655 100)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">Validated C-MAPSS corpus</text><text class="s" x="18" y="53">FD001–FD004 / ZIP / CSV / TXT</text><text class="s" x="18" y="72">Original partitions and file hashes</text></g>
<path class="l" d="M285 143H345M595 143H655"/>
<g transform="translate(345 240)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">Immutable job snapshots</text><text class="s" x="18" y="53">Configuration / policy / model IDs</text><text class="s" x="18" y="72">Idempotency / stage status / retry</text></g>
<g transform="translate(655 240)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">Fit-only causal features</text><text class="s" x="18" y="53">Operating-regime normalization</text><text class="s" x="18" y="72">90 past-only rolling features</text></g>
<path class="l" d="M470 185V240M595 283H655M780 185V240"/>
<g transform="translate(35 380)"><rect class="b" width="250" height="90"/><text class="h" x="18" y="30">MLflow tracking</text><text class="s" x="18" y="53">Real parameters, metrics, artifacts</text><text class="s" x="18" y="74">SQLite + local artifact storage</text></g>
<g transform="translate(345 380)"><rect class="b" width="250" height="90"/><text class="h" x="18" y="30">Versioned model registry</text><text class="s" x="18" y="53">Development-only promotion</text><text class="s" x="18" y="74">Conformal intervals / integrity</text></g>
<g transform="translate(655 380)"><rect class="b" width="250" height="90"/><text class="h" x="18" y="30">Two independent models</text><text class="s" x="18" y="53">Histogram gradient-boosting RUL</text><text class="s" x="18" y="74">Healthy-prefix Isolation Forest</text></g>
<path class="l" d="M345 425H285M655 425H595M780 325V380"/>
<g transform="translate(965 380)"><rect class="b" width="200" height="90"/><text class="h" x="14" y="30">Official evaluation</text><text class="s" x="14" y="53">Truth after predictions</text><text class="s" x="14" y="74">No policy access</text></g><path class="l" d="M905 425H965"/>
<g transform="translate(345 520)"><rect class="b" width="250" height="85"/><text class="h" x="18" y="30">Observed-prefix replay</text><text class="s" x="18" y="53">Frozen preprocessing and models</text><text class="s" x="18" y="72">Quality and uncertainty gates</text></g>
<g transform="translate(655 520)"><rect width="250" height="85" rx="12" fill="#fff2e7" stroke="#ffd5b0"/><text class="h" x="18" y="30">Python triage</text><text class="s" x="18" y="53">RUL / anomaly / trends / persistence</text><text class="s" x="18" y="72">Explanation and complete evidence</text></g>
<path class="l" d="M470 470V520M595 563H655"/>
<g transform="translate(655 640)"><rect class="b" width="510" height="50"/><text class="h" x="15" y="23">SQLite · decisions / orders / audit / local outbox</text><text class="s" x="15" y="42">Simulated records · explicit outcomes · no external dispatch</text></g><path class="l" d="M780 605V640"/>
<text class="s" x="35" y="650">Selected GPU research path:</text><text class="s" x="35" y="670">Transformer → KAN → BiLSTM / final SHAP + LIME</text><text class="s" x="35" y="690">Separate from the measured CPU baseline</text>
</svg>
